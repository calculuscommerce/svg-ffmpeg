<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text id="title" x="60" y="130" font-size="108" fill="#2e7d32" stroke="#2e7d32" stroke-width="2.5" letter-spacing="2">PHOTOSYNTHESIS</text>
  <text id="q1" x="64" y="235" font-size="58" fill="#222">How does a plant</text>
  <text id="q2" x="64" y="300" font-size="58" fill="#222">make its own food?</text>

  <g transform="translate(1110,135) scale(.9)"><g id="sun" data-include="sun"/></g>

  <g id="beams" fill="none" stroke="#f6d55c" stroke-width="7" stroke-linecap="round">
    <path class="beam" d="M1030,160 L830,240"/>
    <path class="beam" d="M1030,195 L850,300"/>
    <path class="beam" d="M1040,225 L850,360"/>
  </g>
  <text id="lbl-sun" x="1085" y="318" font-size="46" fill="#222">Sunlight</text>

  <g transform="translate(700,470) scale(.8)">
    <g id="soil" data-include="soil"/>
    <g id="plant" data-include="plant"/>
  </g>

  <path id="plant-line" d="M714,440 L815,428" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <text id="lbl-plant" x="826" y="440" font-size="48" fill="#222">Plant</text>
</svg>
