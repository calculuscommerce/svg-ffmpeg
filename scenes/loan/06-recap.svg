<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text id="eq" x="60" y="110" font-size="72" stroke-width="1"><tspan fill="#1f6b43">You repay</tspan><tspan fill="#444"> = </tspan><tspan fill="#1f4aa8">Principal</tspan><tspan fill="#444"> + </tspan><tspan fill="#c9700a">Interest</tspan></text>
  <text id="hd" x="62" y="210" font-size="52" fill="#555">Before you borrow:</text>

  <g transform="translate(95,288)"><path class="ck" d="M-24,0 L-8,18 L26,-22" fill="none" stroke="#2e8b57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text id="i1" x="150" y="304" font-size="56" fill="#222">Compare interest rates</text>
  <g transform="translate(95,378)"><path class="ck" d="M-24,0 L-8,18 L26,-22" fill="none" stroke="#2e8b57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text id="i2" x="150" y="394" font-size="56" fill="#222">Check the total cost, not just the EMI</text>
  <g transform="translate(95,468)"><path class="ck" d="M-24,0 L-8,18 L26,-22" fill="none" stroke="#2e8b57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text id="i3" x="150" y="484" font-size="56" fill="#222">Keep the EMI within your budget</text>

  <g id="warn">
    <rect x="60" y="540" width="1160" height="140" rx="26" fill="#fdecec" stroke="#d64545" stroke-width="6"/>
    <g transform="translate(150,610)"><path d="M0,-42 L48,40 L-48,40 Z" fill="#ffd9d9" stroke="#d64545" stroke-width="6" stroke-linejoin="round"/>
      <text y="30" font-size="56" fill="#d64545" text-anchor="middle">!</text></g>
    <text x="235" y="600" font-size="50" fill="#b32d2d">Missed payments mean penalties</text>
    <text x="235" y="655" font-size="50" fill="#b32d2d">and a lower credit score</text>
  </g>
</svg>
