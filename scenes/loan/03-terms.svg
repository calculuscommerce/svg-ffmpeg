<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text id="title" x="60" y="100" font-size="72" fill="#1f4aa8" stroke="#1f4aa8" stroke-width="1.5">3 key ingredients of a loan</text>

  <g id="c1">
    <rect x="60" y="150" width="360" height="520" rx="30" fill="#fff" stroke="#3f6fd1" stroke-width="6"/>
    <text x="240" y="225" font-size="58" fill="#1f4aa8" text-anchor="middle">Principal</text>
    <g transform="translate(240,420) scale(1.5)"><g data-include="moneybag"/></g>
    <text id="v1" x="240" y="520" font-size="62" fill="#222" text-anchor="middle">₹0</text>
    <text x="240" y="600" font-size="38" fill="#555" text-anchor="middle">the amount you borrow</text>
  </g>
  <g id="c2">
    <rect x="460" y="150" width="360" height="520" rx="30" fill="#fff" stroke="#e08a1e" stroke-width="6"/>
    <text x="640" y="225" font-size="58" fill="#c9700a" text-anchor="middle">Interest rate</text>
    <circle cx="640" cy="340" r="80" fill="#fde7c4" stroke="#e08a1e" stroke-width="6"/>
    <text x="640" y="378" font-size="110" fill="#c9700a" text-anchor="middle">%</text>
    <text id="v2" x="640" y="520" font-size="62" fill="#222" text-anchor="middle">0%</text>
    <text x="640" y="600" font-size="38" fill="#555" text-anchor="middle">the price of borrowing</text>
  </g>
  <g id="c3">
    <rect x="860" y="150" width="360" height="520" rx="30" fill="#fff" stroke="#2e8b57" stroke-width="6"/>
    <text x="1040" y="225" font-size="58" fill="#1f6b43" text-anchor="middle">Tenure</text>
    <g transform="translate(1040,340)">
      <rect x="-80" y="-70" width="160" height="140" rx="14" fill="#fff" stroke="#2e8b57" stroke-width="6"/>
      <path d="M-80,-70 L80,-70 L80,-30 L-80,-30 Z" fill="#2e8b57" stroke="#2e8b57" stroke-width="6" stroke-linejoin="round"/>
      <g fill="#2e8b57"><circle cx="-45" cy="-5" r="7"/><circle cx="-15" cy="-5" r="7"/><circle cx="15" cy="-5" r="7"/><circle cx="45" cy="-5" r="7"/>
        <circle cx="-45" cy="25" r="7"/><circle cx="-15" cy="25" r="7"/><circle cx="15" cy="25" r="7"/><circle cx="45" cy="25" r="7"/></g>
    </g>
    <text id="v3" x="1040" y="520" font-size="62" fill="#222" text-anchor="middle">0 months</text>
    <text x="1040" y="600" font-size="38" fill="#555" text-anchor="middle">how long to repay it</text>
  </g>
</svg>
