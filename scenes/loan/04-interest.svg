<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text id="title" x="60" y="105" font-size="70" fill="#e08a1e" stroke="#e08a1e" stroke-width="1.5">Interest = the fee for borrowing</text>
  <text id="sub" x="62" y="160" font-size="42" fill="#555">Example: 12% a year, repaid over 12 months</text>

  <rect id="bar-p" x="120" y="335" width="700" height="90" fill="#6d9bf0" stroke="#274a9e" stroke-width="5"/>
  <rect id="bar-i" x="820" y="335" width="46" height="90" fill="#f0a030" stroke="#b86a0b" stroke-width="5"/>

  <text id="lbl-p" x="470" y="240" font-size="42" fill="#274a9e" text-anchor="middle">You borrow</text>
  <text id="v-p" x="470" y="300" font-size="60" fill="#274a9e" text-anchor="middle">₹0</text>

  <text id="lbl-i" x="1010" y="240" font-size="42" fill="#b86a0b" text-anchor="middle">Interest</text>
  <text id="v-i" x="1010" y="300" font-size="60" fill="#b86a0b" text-anchor="middle">₹0</text>
  <path id="ptr2" d="M920,285 L860,325" fill="none" stroke="#b86a0b" stroke-width="5" stroke-linecap="round"/>

  <path id="brace" d="M120,470 L120,490 L866,490 L866,470" fill="none" stroke="#2e8b57" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text id="lbl-t" x="493" y="550" font-size="46" fill="#1f6b43" text-anchor="middle">You repay in total</text>
  <text id="v-t" x="493" y="640" font-size="92" fill="#1f6b43" stroke="#1f6b43" stroke-width="1.5" text-anchor="middle">₹0</text>
